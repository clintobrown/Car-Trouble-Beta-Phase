<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Trouble | Car Won't Start</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0c1220;color:#eef3fc}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:740px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span{color:#70c5ff}.pill{background:#23324a;border-radius:20px;padding:7px 12px;font-size:12px}main{background:#161f30;border:1px solid #2d3a50;border-radius:20px;padding:25px;margin-top:20px}h1{font-size:27px;margin:6px 0 12px}p{color:#b7c5d8;line-height:1.6}.small{font-size:13px}.eyebrow{font-size:12px;color:#70c5ff;text-transform:uppercase;letter-spacing:2px;font-weight:700}.choices{display:grid;gap:10px;margin:24px 0}button{font:inherit;cursor:pointer}.choice{width:100%;text-align:left;background:#23324a;color:#f4f7ff;border:1px solid #40516c;padding:15px 17px;border-radius:12px}.choice:hover,.choice:focus{border-color:#70c5ff;background:#2d4160}.bottom{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:transparent;color:#c4d5ea;border:1px solid #42536d;border-radius:10px;padding:10px 14px}.alert{background:#4c2928;border:1px solid #b35d55;border-radius:12px;padding:15px;margin:16px 0}.result{border-left:4px solid #70c5ff;padding-left:15px}.result h2{margin-bottom:6px}.breadcrumb{font-size:12px;color:#9aabc4;margin-top:18px;line-height:1.8}.progress{height:5px;background:#26344a;border-radius:8px;margin-top:14px;overflow:hidden}.progress div{height:100%;background:#70c5ff;transition:width .2s}footer{color:#8ea0b7;font-size:12px;margin:20px 4px}a{color:#8acbff}@media(max-width:500px){main{padding:19px}h1{font-size:23px}}.vehicle-fields{display:grid;gap:14px;margin:20px 0}.vehicle-fields label{display:grid;gap:7px;font-weight:650}.vehicle-fields select{background:#18243a;color:#f2f6ff;border:1px solid #405574;border-radius:10px;padding:14px;font-size:16px;width:100%}.vehicle-fields select:disabled{opacity:.5}.model-status{font-size:12px;color:#9fb4d4;min-height:15px}button:disabled{opacity:.45;cursor:not-allowed}.vehicle-tag{background:#202e43;border:1px solid #3b506a;border-radius:10px;padding:10px 12px;margin:0 0 18px;color:#dbeaff;font-size:13px}.steps{background:#101b2d;border:1px solid #334760;border-radius:12px;padding:16px;margin:18px 0}.steps h2{font-size:18px;margin:0 0 10px}.steps ol{padding-left:22px;line-height:1.6}.steps li{margin:9px 0}.caution{background:#3a3024;border:1px solid #8e7441;border-radius:10px;padding:12px;margin:12px 0;color:#f3d9a7}.meta{color:#a5c4e5;font-size:13px}.report-area{white-space:pre-wrap;background:#101b2d;padding:12px;border-radius:8px}.vehicle-fields input{background:#18243a;color:#f2f6ff;border:1px solid #405574;border-radius:10px;padding:14px;font-size:16px;width:100%}</style></head><body><div class="wrap"><header><div class="brand">CAR <span>TROUBLE</span></div><div class="pill">Guided car diagnosis · Prototype</div></header><div class="progress"><div id="bar"></div></div><main id="screen"></main><div class="breadcrumb" id="trail"></div><footer>For conventional gasoline-powered vehicles. This educational tool cannot confirm every fault remotely. Never bypass safety interlocks, touch high-voltage systems, or work near moving parts. Follow your vehicle manual.</footer></div><script>
const N={
start:{q:'What happens when you try to start the car?',desc:'Choose what you actually hear or see. “Cranking” means the engine is being turned by the starter.',opts:[['No lights or sounds at all','dead'],['Dashboard lights up, but no engine movement','dash'],['One click, no crank','single'],['Rapid clicking','rapid'],['Starter whirs, but engine does not turn','whir'],['Grinding noise','grind'],['Engine cranks slowly','slow'],['Engine cranks normally, but will not start','crank'],['Engine cranks unusually fast','fast'],['Engine cranks unevenly','uneven'],['Engine coughs or almost starts','cough'],['Engine cranks then stops suddenly','abrupt'],['Starts, then dies immediately','stall'],['Starts rough, then stalls','rough'],['Starts only when pressing the accelerator','pedal'],['Starts normally now, but sometimes fails','intermittent']]},
dead:{q:'Do any interior lights or headlights work?',opts:[['No, everything is dead','batteryVisual'],['Yes, some lights work','batteryTest']]},dash:{q:'Does a security/key warning appear?',opts:[['Yes','security'],['No','park']]},single:{q:'Does the dashboard dim dramatically when you try?',opts:[['Yes','batteryTest'],['No','batteryTest']]},rapid:{q:'Have you tried a correctly performed jump-start?',opts:[['Yes, it cranks or starts with a jump','jumpworks'],['Yes, still clicking','batteryTest'],['No / not safely possible','batteryVisual']]},whir:{q:'Does the engine itself turn over, or only a high-pitched motor sound?',opts:[['Only high-pitched whirring','starterEngage'],['Engine actually turns','crank']]},grind:{q:'Does the grinding happen before the engine starts or after?',opts:[['Before or while attempting to start','grindStop'],['After engine starts','grindStop']]},slow:{q:'Do the lights dim heavily while cranking?',opts:[['Yes','batteryTest'],['No / unsure','batteryTest']]},crank:{q:'Is the security or key symbol flashing during the attempt?',opts:[['Yes','security'],['No','fuel']]},fast:{q:'Does the engine sound unusually fast and even, as if it has little resistance?',opts:[['Yes','compression'],['Not sure','mechanicMechanical']]},uneven:{q:'Does it sound like the engine speeds up and slows down with each turn?',opts:[['Yes','compression'],['Not sure','batteryTest']]},cough:{q:'Is there a strong gasoline smell or visible fuel leak?',opts:[['Yes','fuelDanger'],['No','fuel']]},abrupt:{q:'Did all dashboard power disappear at the same time?',opts:[['Yes','batteryVisual'],['No','mechanicMechanical']]},stall:{q:'Does a security warning flash as it stalls?',opts:[['Yes','security'],['No','stallFuel']]},rough:{q:'Is the check-engine light flashing while it runs?',opts:[['Yes','misfireStop'],['No','codes']]},pedal:{q:'Does it run if you keep the pedal pressed lightly?',opts:[['Yes','idle'],['No','codes']]},intermittent:{q:'When is it most likely to fail?',opts:[['After sitting overnight','overnight'],['Only when hot','hot'],['After refueling','refuel'],['Randomly / no pattern','codes']]},
batteryVisual:{q:'Are the battery terminals loose, heavily corroded, or visibly damaged?',desc:'Look only. Do not touch damaged or leaking batteries.',opts:[['Yes','terminal'],['No / cannot tell','batteryTest']]},batteryTest:{q:'Can you safely check the 12V battery with a multimeter or battery tester?',opts:[['Yes, voltage is below about 12.4V at rest','lowBattery'],['Yes, around 12.6V at rest','load'],['No tools available','noTools']]},lowBattery:{q:'After charging, does the battery pass a proper load test?',opts:[['No','badBattery'],['Yes','load'],['Cannot test','batteryShop']]},load:{q:'During a start attempt, does battery voltage collapse below the vehicle’s specified cranking threshold?',desc:'A common lead-acid reference is ~9.6V at 70°F under a specified load, but use vehicle/battery specifications.',opts:[['Yes','batteryShop'],['No','cables'],['Unable to measure','batteryShop']]},cables:{q:'Has a technician measured excessive voltage drop across either starter power or ground cables under load?',opts:[['Yes','cableRepair'],['No','startCommand'],['Not tested','cableTest']]},startCommand:{q:'Is the starter solenoid receiving its commanded start signal?',desc:'This requires proper electrical test equipment and vehicle wiring information.',opts:[['Yes','starterMechanical'],['No','control'],['Not tested / no equipment','professional']]},park:{q:'Does it crank when you select Neutral instead of Park?',desc:'Keep the parking brake set. Do not bypass interlocks.',opts:[['Yes','range'],['No','startCommand'],['Cannot test safely','professional']]},fuel:{q:'Is there definitely fuel in the tank?',opts:[['No / uncertain','fuelLevel'],['Yes','codes']]},codes:{q:'Can you read diagnostic trouble codes with an OBD-II scanner?',opts:[['Yes, codes are present','codeAction'],['Yes, no codes','rpm'],['No scanner','noScanner']]},rpm:{q:'Does scan-tool live data show plausible engine RPM while cranking?',opts:[['No / zero','rpmFault'],['Yes','spark'],['Not available','professional']]},spark:{q:'Has an approved ignition spark test confirmed spark during cranking?',opts:[['No spark','sparkFault'],['Spark present','fuelPressure'],['Not tested','professional']]},fuelPressure:{q:'Does measured fuel pressure meet the vehicle specification while cranking?',opts:[['No','pumpCircuit'],['Yes','injector'],['Not measured','professional']]},pumpCircuit:{q:'Is proper electrical power and ground reaching the fuel pump when commanded?',opts:[['No','pumpWiring'],['Yes','pumpFault'],['Not tested','professional']]},injector:{q:'Is injector command present during cranking?',opts:[['No','injectorControl'],['Yes','compression'],['Not tested','professional']]},compression:{q:'Has a compression or relative-compression test shown a problem?',opts:[['Yes, low or uneven','mechanicMechanical'],['No, normal','timing'],['Not tested','mechanicMechanical']]},timing:{q:'Has cam/crank synchronization and mechanical timing been verified?',opts:[['No, timing fault found','timingFault'],['Yes, timing is correct','advanced'],['Not tested','professional']]},stallFuel:{q:'Does fuel pressure drop below specification just before it stalls?',opts:[['Yes','pumpCircuit'],['No','codes'],['Not tested','codes']]},idle:{q:'Has the throttle body/idle-air system been inspected using the vehicle procedure?',opts:[['Dirty, restricted, or faulty','throttle'],['Looks normal','codes'],['Not inspected','throttleInspect']]},overnight:{q:'Is the battery weak after sitting?',opts:[['Yes','drain'],['No','codes'],['Not measured','batteryTest']]},hot:{q:'When hot, does the engine fail to crank or crank normally without starting?',opts:[['Fails to crank','startCommand'],['Cranks normally','codes']]},refuel:{q:'Does it crank for a long time immediately after filling the tank?',opts:[['Yes','purge'],['No','codes']]},
security:{end:'Possible immobilizer / key authorization issue',action:'Try a known-good spare key and check for a low key-fob battery or relevant warning. If the security warning persists, have the key authorization system scanned. Do not bypass it.'},terminal:{end:'Battery connection problem is possible',action:'Have corroded or loose terminals safely cleaned and secured; replace damaged connectors. Charge/test the battery, then retry. Avoid sparks near the battery.'},jumpworks:{end:'Low battery voltage or a connection problem is likely',action:'Charge and load-test the battery and inspect connections. Once running, test the charging system. A successful jump does not prove the battery itself is defective.'},badBattery:{end:'Battery failed its load test',action:'Replace with the correct battery specification, secure connections, and verify charging-system operation.'},batteryShop:{end:'Battery capacity or excessive starter load needs testing',action:'Request a battery load test, voltage-drop test, and starter-current test before replacing anything.'},noTools:{end:'Next action: obtain a battery test',action:'Check terminals visually. Arrange a battery/charging-system test or use a suitable jump pack according to its instructions. If it starts, test the battery and alternator; if not, pursue starter circuit testing.'},cableRepair:{end:'Excessive resistance in the starter circuit',action:'Repair the specific cable, terminal, or ground connection identified by voltage-drop testing. Verify normal cranking afterward.'},cableTest:{end:'Next action: starter cable voltage-drop test',action:'Ask a technician to measure voltage drop on positive and ground sides while attempting to crank. Do not replace the starter based only on clicking.'},range:{end:'Park/Neutral interlock or range input fault suspected',action:'Have the transmission range switch/shift linkage and control-module inputs checked. Do not bypass the interlock.'},starterMechanical:{end:'Starter assembly or mechanical load fault suspected',action:'With correct supply, ground and command confirmed, test starter current and verify the engine turns freely using approved procedures. Repair the verified starter or mechanical fault.'},starterEngage:{end:'Starter engagement problem suspected',action:'Stop repeated attempts. Inspect starter pinion/drive and flywheel ring gear; repair damaged parts. This usually requires a mechanic.'},grindStop:{end:'Stop cranking to avoid gear damage',action:'Have starter mounting, pinion engagement, and flywheel ring gear inspected. If grinding persists after startup, check for a starter that stays engaged.'},control:{end:'Start control circuit fault suspected',action:'Check the start request, fuses, relay, immobilizer, Park/Neutral or clutch input, and wiring using vehicle-specific diagnostics.'},professional:{end:'A technician-level test is needed',action:'Bring this symptom history to a repair shop. Request measured results (voltage, command, fuel pressure, spark, compression as applicable) before authorizing parts replacement.'},fuelLevel:{end:'Fuel level not confirmed',action:'Add the correct fuel if the tank may be empty. If it still cranks without starting, continue with code, spark and fuel-pressure testing.'},fuelDanger:{end:'Possible fuel leak or flooding',action:'Stop starting attempts. Avoid sparks and ignition sources. If fuel is leaking, have the vehicle inspected before attempting to start it again.'},codeAction:{end:'Diagnostic trouble codes are available',action:'Record exact codes and freeze-frame data. Use vehicle-specific diagnostics to test the implicated circuit; codes do not automatically identify a part to replace.'},noScanner:{end:'Next action: read fault codes',action:'Use a compatible OBD-II scanner, or request a scan at a repair shop. A scanner may not reveal every no-start fault; further tests may still be required.'},rpmFault:{end:'Missing/implausible engine-speed signal',action:'Have crankshaft-position sensor signal, wiring, power/ground as applicable, and trigger wheel checked. Do not replace the sensor without testing.'},sparkFault:{end:'Ignition system fault suspected',action:'Test coil power and command, engine-speed/cam synchronization, relevant fuses, and wiring. Repair the measured fault.'},pumpWiring:{end:'Fuel pump electrical supply/control problem',action:'Have pump fuses, relay/module command, wiring and grounds tested under load. Repair the identified circuit.'},pumpFault:{end:'Fuel delivery hardware or pressure regulation fault suspected',action:'With proper pump command and power confirmed, test pump output, fuel restrictions and pressure regulation before replacing a component.'},injectorControl:{end:'Fuel injector command is missing',action:'Check immobilizer authorization, cam/crank synchronization, injector supply, control circuits and ECM inputs using a wiring diagram.'},mechanicMechanical:{end:'Possible engine mechanical fault',action:'Stop repeated cranking if binding or timing failure is suspected. Request compression, leak-down and mechanical timing checks. Repair only after the fault is verified.'},timingFault:{end:'Engine timing/synchronization fault confirmed',action:'Have the timing drive and related components repaired according to the service manual; inspect for possible valve damage before further starting.'},advanced:{end:'Advanced engine-management diagnosis needed',action:'Request checks of injector delivery, air metering, exhaust restriction, flooding, sensor plausibility and ECM control, guided by measured results.'},misfireStop:{end:'Active severe misfire possible',action:'Avoid continued running if the check-engine light flashes. Retrieve codes and test ignition, fuel injection and compression to prevent catalytic-converter damage.'},throttle:{end:'Idle-air / throttle fault suspected',action:'Clean or repair the verified throttle/idle-control issue using the manufacturer procedure; perform any required relearn.'},throttleInspect:{end:'Next action: idle and throttle inspection',action:'Have the throttle body, idle control (if equipped), and intake leaks checked. Some vehicles require a throttle relearn after cleaning.'},drain:{end:'Possible parasitic battery drain',action:'Fully charge and test the battery, verify charging output, then measure key-off current after modules sleep. Identify the circuit drawing excessive current.'},purge:{end:'EVAP purge valve fault possible',action:'Have the purge valve tested for unintended flow when commanded closed. Replace only if it fails the specified test.'}};
const VEHICLE_MAKES=['Acura','Alfa Romeo','Audi','BMW','Buick','Cadillac','Chevrolet','Chrysler','Dodge','Fiat','Ford','Genesis','GMC','Honda','Hyundai','Infiniti','Jaguar','Jeep','Kia','Land Rover','Lexus','Lincoln','Mazda','Mercedes-Benz','MINI','Mitsubishi','Nissan','Porsche','Ram','Subaru','Tesla','Toyota','Volkswagen','Volvo'];
const FALLBACK_MODELS={Toyota:['4Runner','Camry','Corolla','Highlander','Prius','RAV4','Sienna','Tacoma','Tundra'],Honda:['Accord','Civic','CR-V','HR-V','Odyssey','Pilot','Ridgeline'],Ford:['Bronco','Edge','Escape','Expedition','Explorer','F-150','Focus','Mustang','Ranger'],Chevrolet:['Camaro','Colorado','Equinox','Malibu','Silverado','Suburban','Tahoe','Traverse'],Nissan:['Altima','Frontier','Maxima','Murano','Pathfinder','Rogue','Sentra','Titan'],Hyundai:['Elantra','Kona','Palisade','Santa Fe','Sonata','Tucson'],Kia:['Forte','K5','Optima','Sorento','Soul','Sportage','Telluride'],Jeep:['Cherokee','Compass','Gladiator','Grand Cherokee','Renegade','Wrangler'],Subaru:['Ascent','BRZ','Crosstrek','Forester','Impreza','Legacy','Outback'],BMW:['3 Series','5 Series','X1','X3','X5'],Volkswagen:['Atlas','Golf','Jetta','Passat','Tiguan']};
let vehicle={year:'',make:'',model:'',powertrain:'',engine:'Not sure',vin:''};let vinStatus='';let vinBusy=false;let modelOptions=[];let modelStatus='';let modelRequest=0;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function vehicleScreen(){let s=document.getElementById('screen');document.getElementById('bar').style.width='5%';document.getElementById('trail').textContent='Step 1: Identify your vehicle';s.innerHTML=`<div class="eyebrow">Step 1 · Your vehicle</div><h1>I own a...</h1><p>Select the year and manufacturer. The model list loads automatically.</p><div class="vehicle-fields"><label>Year<select id="vyear"><option value="">Select year</option>${Array.from({length:47},(_,i)=>2027-i).map(y=>`<option value="${y}" ${vehicle.year===String(y)?'selected':''}>${y}</option>`).join('')}</select></label><label>Manufacturer<select id="vmake"><option value="">Select manufacturer</option>${VEHICLE_MAKES.map(m=>`<option ${vehicle.make===m?'selected':''}>${m}</option>`).join('')}</select></label><label>Model<select id="vmodel" ${!vehicle.make||!vehicle.year?'disabled':''}><option value="">${vehicle.make&&vehicle.year?'Select model':'Select year and manufacturer first'}</option>${modelOptions.map(m=>`<option value="${esc(m)}" ${vehicle.model===m?'selected':''}>${esc(m)}</option>`).join('')}</select></label><div class="model-status" id="modelstatus">${esc(modelStatus)}</div><label>Engine<select id="vengine">${(vehicle.engineOptions||['Not sure']).map(v=>`<option value="${esc(v)}" ${vehicle.engine===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>Powertrain<select id="vpower"><option value="">Select powertrain</option>${['Gasoline','Diesel','Hybrid','Electric','Not sure'].map(v=>`<option ${vehicle.powertrain===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Optional: 17-character VIN (to identify engine automatically)<input id="vvin" maxlength="17" placeholder="Enter VIN" value="${esc(vehicle.vin)}" style="background:#18243a;color:#f2f6ff;border:1px solid #405574;border-radius:10px;padding:14px;font-size:16px;width:100%" /></label><div class="bottom"><button class="secondary" id="decodeVin" ${vinBusy?'disabled':''}>${vinBusy?'Decoding…':'Identify engine from VIN'}</button></div><div class="model-status">${esc(vinStatus)}</div></div><div class="bottom"><button id="vehicleNext" class="choice" ${!(vehicle.year&&vehicle.make&&vehicle.model&&vehicle.powertrain)?'disabled':''}>Continue to symptoms →</button></div><p style="font-size:12px;opacity:.75">Models are requested from NHTSA's public vehicle database when online. Availability varies; a backup list is provided for selected makes. Engine details are populated when NHTSA can decode a VIN. Year/make/model alone do not reliably identify an exact engine. No vehicle-specific repair specifications are assumed.</p>`;
for(let id of ['vyear','vmake'])document.getElementById(id).addEventListener('change',e=>{vehicle[id==='vyear'?'year':'make']=e.target.value;vehicle.model='';vehicle.engine='Not sure';vehicle.engineOptions=['Not sure'];vinStatus='';modelOptions=[];modelStatus='';vehicleScreen();loadModels()});
document.getElementById('vmodel').addEventListener('change',e=>{vehicle.model=e.target.value;vehicle.engine='Not sure';vehicle.engineOptions=['Not sure'];vinStatus='';vehicleScreen()});document.getElementById('vengine').addEventListener('change',e=>{vehicle.engine=e.target.value;vehicleScreen()});document.getElementById('vvin').addEventListener('input',e=>{vehicle.vin=e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'').slice(0,17)});document.getElementById('decodeVin').addEventListener('click',decodeVin);document.getElementById('vpower').addEventListener('change',e=>{vehicle.powertrain=e.target.value;vehicleScreen()});document.getElementById('vehicleNext').addEventListener('click',()=>{if(vehicle.year&&vehicle.make&&vehicle.model&&vehicle.powertrain){current='start';render()}})}
async function decodeVin(){const vin=vehicle.vin;if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){vinStatus='Enter a valid 17-character VIN (no I, O or Q).';vehicleScreen();return;}vinBusy=true;vinStatus='Checking NHTSA VIN data…';vehicleScreen();try{const r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json');if(!r.ok)throw Error('Service unavailable');const data=await r.json();const d=data.Results?.[0]||{};if(d.ErrorCode && d.ErrorCode.split(',').some(x=>x.trim()!=='0'))throw Error('VIN could not be fully decoded');const parts=[d.DisplacementL?d.DisplacementL+'L':'',d.EngineCylinders?d.EngineCylinders+' cylinders':'',d.EngineModel||'',d.FuelTypePrimary||''].filter(Boolean);if(!parts.length)throw Error('NHTSA did not return engine details');vehicle.engine=parts.join(' · ');vehicle.engineOptions=[vehicle.engine,'Not sure'];if(d.FuelTypePrimary){const fuel=d.FuelTypePrimary.toLowerCase();vehicle.powertrain=fuel.includes('diesel')?'Diesel':fuel.includes('electric')&&!fuel.includes('gasoline')?'Electric':fuel.includes('gasoline')?'Gasoline':vehicle.powertrain;}vinStatus='Engine information decoded from VIN. Verify against vehicle documentation.';}catch(e){vinStatus='Could not identify the engine automatically: '+e.message+'. Select “Not sure” to continue.';}finally{vinBusy=false;vehicleScreen();}}
async function loadModels(){if(!vehicle.make||!vehicle.year)return;let req=++modelRequest,year=vehicle.year,make=vehicle.make;modelStatus='Loading models…';vehicleScreen();try{let url='https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/'+encodeURIComponent(make)+'/modelyear/'+encodeURIComponent(year)+'?format=json';let r=await fetch(url);if(!r.ok)throw Error('Unavailable');let d=await r.json();if(req!==modelRequest||year!==vehicle.year||make!==vehicle.make)return;modelOptions=[...new Set((d.Results||[]).map(x=>x.Model_Name).filter(Boolean))].sort((a,b)=>a.localeCompare(b));modelStatus=modelOptions.length?'Models available for selected year':'No models returned for this selection';}catch(e){if(req!==modelRequest)return;modelOptions=FALLBACK_MODELS[make]||[];modelStatus=modelOptions.length?'Offline backup list (not year-verified)':'Model database unavailable. Connect to the internet and retry by changing year or make.'}vehicleScreen()}

const GUIDES={
security:['Try a known-working spare key if available.','Observe the security/key indicator during a start attempt.','Check the owner manual for the exact indicator meaning and approved key-relearning procedure.','If the second key also fails, request a scan of immobilizer authorization data and key/antenna circuits.'],
terminal:['With ignition off, visually inspect battery clamps for corrosion, looseness, or broken cables.','If the battery is cracked, leaking, swollen, or hot, stop and request professional service.','Have loose or corroded connections cleaned and tightened to vehicle specification.','Retest starting and verify the charging system.'],
jumpworks:['Have the 12V battery fully charged and tested under load; a successful jump-start alone does not prove the battery is bad.','Inspect battery terminals and main grounds.','After starting, test charging voltage/output using the vehicle-specific procedure.','If the battery discharges again, test for excessive key-off current draw.'],
badBattery:['Confirm the battery was fully charged before the load test.','Verify the failed test used the correct battery type and rating.','Replace with the specified battery type and size if the failure is confirmed.','Check charging performance after installation.'],
batteryShop:['Request a battery state-of-health/load test and starter current test.','Ask for the measured battery voltage during crank, not just resting voltage.','If battery passes, test cable voltage drop and starter mechanical load.'],
noTools:['Check that lights, accessories, and doors were not left on.','Look for visibly loose or corroded battery connections without touching damaged components.','Arrange a 12V battery load test at a service location.','Use the results to decide whether to test cables, starter, or charging system.'],
cableRepair:['Identify which cable/connection exceeded the manufacturer voltage-drop specification.','With the circuit safely de-energized, repair or replace the defective connection/cable.','Repeat voltage-drop test under the same load.','Confirm normal cranking and charging.'],
cableTest:['Ask a technician to measure positive-side voltage drop from battery post to starter feed while cranking.','Measure ground-side voltage drop from starter case to battery negative post.','Compare both readings with manufacturer specifications.','Repair the side with excessive drop and retest.'],
range:['With foot firmly on brake, try starting in Neutral if the owner manual permits.','Check whether the dashboard correctly displays Park and Neutral.','If behavior differs, request range-switch/interlock input testing.','Do not bypass the neutral-safety or clutch switch.'],
starterMechanical:['Verify the engine is free to rotate before condemning the starter.','Measure voltage at starter power and command terminals during a start request.','Measure starter current draw and compare with vehicle specifications.','Replace or repair the starter only after supply, command, and mechanical load are verified.'],
starterEngage:['Stop repeated start attempts to avoid damaging the ring gear.','Confirm that the starter motor spins while the crankshaft stays stationary.','Have the starter drive, mounting, pinion, and flywheel/flexplate ring gear inspected.','Repair the confirmed engagement defect and verify repeated clean starts.'],
grindStop:['Stop cranking immediately.','Have starter mounting and pinion engagement inspected.','Inspect ring-gear teeth and check whether the starter remains engaged after the engine starts.','Repair the verified mechanical/control defect before another start attempt.'],
control:['Check starter-related fuses using the owner manual fuse chart.','Confirm the vehicle sees a start request and required Park/Neutral or clutch status.','Test starter relay command and output with a wiring diagram.','Locate the open/high-resistance control path; never bypass safety interlocks.'],
professional:['Write down the exact symptom and whether it occurs hot, cold, or intermittently.','Request the measurements associated with the failed test, rather than a parts guess.','Ask for the relevant manufacturer procedure and recorded pass/fail results.'],
fuelLevel:['Check the fuel gauge and, if safe, verify fuel is present; do not rely solely on the gauge.','If empty, add the correct fuel and follow the owner manual starting instructions.','If fuel is present and the engine still will not start, return to fuel/spark/engine-management diagnosis.'],
fuelDanger:['Do not attempt another start if fuel is leaking or the odor is strong.','Keep flames, sparks, and ignition sources away.','Have the leak/flooding condition inspected and corrected before cranking.'],
codeAction:['Record the exact diagnostic trouble codes, including pending codes and freeze-frame data if available.','Do not assume a code names the failed part; follow the code diagnostic chart.','Check relevant live data during the symptom and verify the suspected circuit.','Retest after repair and confirm the fault does not return.'],
noScanner:['Arrange a scan of engine, body, and immobilizer modules as applicable.','Record all codes before clearing anything.','Use the code descriptions to select tests, not to order parts blindly.'],
rpmFault:['Observe engine RPM in scan data during cranking.','If absent or implausible, test crank sensor power, ground, signal, and wiring as applicable.','Check sensor trigger/tone wheel and cam/crank synchronization.','Replace a sensor only if its failure is confirmed.'],
sparkFault:['Use a manufacturer-approved spark tester; never hold an ignition wire or coil while cranking.','Verify ignition coil power and control command.','Check crank/cam signals and synchronization.','Isolate the failed ignition component or control circuit before replacement.'],
pumpWiring:['Confirm fuel pressure is below the specified value using approved equipment.','Test fuel pump fuse, relay/module command, supply voltage, and ground.','If power/ground is missing, trace that circuit before replacing the pump.','If electrical supply passes, continue to pump delivery and pressure regulation tests.'],
pumpFault:['Record actual fuel pressure and compare with the exact vehicle specification.','Verify pump voltage, ground, and command under load.','Check fuel restriction, pressure regulation, and pump delivery using approved procedures.','Replace only the component that fails testing.'],
injectorControl:['Verify start authorization and engine RPM/cam-crank synchronization.','Check injector supply voltage and ECM command with approved tools.','Trace any missing control signal or power feed using the wiring diagram.','Avoid opening pressurized fuel lines without the manufacturer procedure.'],
mechanicMechanical:['Stop cranking if the engine binds, stops abruptly, or appears mechanically damaged.','Request a relative compression test followed by mechanical compression/leak-down as indicated.','Check valve timing and accessory binding; rule out hydrolock before further cranking.','Repair the verified mechanical defect.'],
timingFault:['Do not continue cranking.','Verify timing-drive alignment and assess possible piston-to-valve contact.','Repair the timing system to manufacturer specification.','Confirm compression and engine operation after repair.'],
advanced:['Check for codes, implausible sensor data, and cam/crank synchronization.','Measure spark, injector command, actual fuel pressure, and compression.','Investigate flooding, intake leaks, throttle behavior, and exhaust restriction based on failed measurements.','Document the failed test before replacing any component.'],
misfireStop:['If the check-engine light flashes, stop driving and avoid prolonged idling.','Record codes and cylinder-specific misfire data.','Test ignition, injector operation, and compression on the affected cylinders.','Verify the repair without prolonged misfire operation.'],
throttle:['Inspect throttle body/idle-air passages as applicable.','Check for intake leaks and compare commanded versus actual throttle position.','Clean or repair only the confirmed issue using the manufacturer procedure.','Perform the specified idle/throttle relearn and verify stable idle.'],
throttleInspect:['Check whether the engine stays running with light accelerator input.','Inspect throttle body, idle-air-control system (if fitted), and intake leaks.','Check idle-control data and fuel trims with a scanner.','Use the manufacturer cleaning/relearn procedure if indicated.'],
drain:['Fully charge and load-test the battery first.','Verify charging system performance.','Allow vehicle modules to enter sleep mode, then measure key-off current with appropriate equipment.','Identify the responsible circuit before replacing a module.'],
purge:['Note whether the problem follows refueling.','Have EVAP purge flow tested while the valve is commanded closed.','If the valve leaks when it should seal, repair/replace it.','Verify hot and post-refueling restarts.']
};
const TOOL_HINTS={security:'Spare key; scan tool if available',terminal:'Visual inspection; battery terminal tools for trained users',jumpworks:'Battery tester and charging-system tester',badBattery:'Battery load tester',batteryShop:'Battery load tester; multimeter; current clamp',noTools:'No tools required for initial checks',cableRepair:'Multimeter; manufacturer wiring/service data',cableTest:'Multimeter; manufacturer wiring/service data',range:'Owner manual; scan tool',starterMechanical:'Multimeter; current clamp; service data',starterEngage:'Professional mechanical inspection',grindStop:'Professional mechanical inspection',control:'Multimeter; scan tool; wiring diagram',fuelLevel:'No tools for initial check',fuelDanger:'Professional inspection',codeAction:'OBD-II scanner',noScanner:'OBD-II scanner',rpmFault:'Scan tool; multimeter/oscilloscope',sparkFault:'Approved spark tester; scan tool',pumpWiring:'Fuel-pressure tester; multimeter',pumpFault:'Fuel-pressure tester; electrical test tools',injectorControl:'Scan tool; electrical test tools',mechanicMechanical:'Compression/leak-down tools',timingFault:'Professional mechanical inspection',advanced:'Scan tool; diagnostic test equipment',misfireStop:'OBD-II scanner',throttle:'Scan tool; service data',throttleInspect:'Visual inspection; scan tool',drain:'Battery tester; low-current meter',purge:'Scan tool; purge flow test tools'};
function vehicleBanner(){return `<div class="vehicle-tag">🚗 ${esc([vehicle.year,vehicle.make,vehicle.model].filter(Boolean).join(' '))} · ${esc(vehicle.engine||'Engine not identified')} · ${esc(vehicle.powertrain||'Powertrain unknown')}</div>`}
function guidePanel(id){let g=GUIDES[id];if(!g)return '';return `<section class="steps"><h2>What to do next</h2><div class="meta">Tools: ${esc(TOOL_HINTS[id]||'Varies by vehicle')}</div><ol>${g.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="caution"><strong>Vehicle-specific values:</strong> No exact fuse location, torque, pressure, voltage-drop limit, or part number is supplied without verified service data for this vehicle. Check its owner/service manual.</div></section>`}
function safetyGate(){if(vehicle.powertrain==='Electric'||vehicle.powertrain==='Hybrid'||vehicle.powertrain==='Diesel'){let t=vehicle.powertrain==='Electric'?'Electric vehicles do not use a conventional gasoline starter.':vehicle.powertrain==='Hybrid'?'Hybrid vehicles may start their engine automatically and have high-voltage systems.':'Diesel engines have different starting and fuel/ignition diagnostics.';return `<div class="eyebrow">Powertrain-specific guidance required</div>${vehicleBanner()}<h1>This version does not cover your powertrain</h1><p>${t} The gasoline diagnostic tree may be misleading.</p><div class="alert">Do not work on high-voltage components or attempt gasoline ignition tests on this vehicle.</div><p>Use the owner manual or a qualified technician for the appropriate diagnostic procedure.</p><div class="bottom"><button class="secondary" onclick="vehicleScreen()">← Change vehicle</button></div>`}return ''}
function render(){const n=N[current],s=document.getElementById('screen');if(safetyGate()){s.innerHTML=safetyGate();document.getElementById('trail').textContent='Vehicle identification';return;}document.getElementById('bar').style.width=Math.min(100,Math.max(3,(history.length+1)*10))+'%';document.getElementById('trail').textContent=answers.length?esc(vehicle.year+' '+vehicle.make+' '+vehicle.model)+' · Your path: '+answers.join(' → '):'Choose an observation to begin.';if(n.end){s.innerHTML=`${vehicleBanner()}<div class="eyebrow">Diagnostic endpoint</div><div class="result"><h1>${n.end}</h1><p>${n.action}</p></div>${guidePanel(current)}<div class="alert"><strong>Important:</strong> This is a likely diagnosis or next action, not a confirmed repair unless a specified test passed.</div><div class="bottom"><button class="secondary" onclick="back()">← Previous question</button><button class="secondary" onclick="restart()">Start over</button><button class="secondary" onclick="report()">Copy diagnostic report</button></div>`}else{s.innerHTML=`${vehicleBanner()}<div class="eyebrow">Question ${history.length+1}</div><h1>${n.q}</h1>${n.desc?`<p>${n.desc}</p>`:''}<div class="choices">${n.opts.map(([label,id],i)=>`<button class="choice" onclick="choose(${i})">${label} <span style="float:right">›</span></button>`).join('')}</div><div class="bottom"><button class="secondary" onclick="back()" ${history.length?'':'disabled'}>← Back</button><button class="secondary" onclick="restart()">Start over</button></div>`}}function choose(i){let [label,id]=N[current].opts[i];history.push(current);answers.push(label);current=id;render()}function back(){if(!history.length)return;current=history.pop();answers.pop();render()}function restart(){current='start';history=[];answers=[];vehicleScreen()}function report(){let n=N[current],t='CAR TROUBLE DIAGNOSTIC REPORT\nVehicle: '+[vehicle.year,vehicle.make,vehicle.model,vehicle.powertrain,vehicle.engine].join(' ')+'\n'+answers.map((a,i)=>(i+1)+'. '+a).join('\n')+'\n\nRESULT: '+n.end+'\nACTION: '+n.action+'\n\nNEXT STEPS:\n'+(GUIDES[current]||[]).map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nEducational guidance only; verify with vehicle-specific testing.';navigator.clipboard?.writeText(t).then(()=>alert('Report copied')).catch(()=>prompt('Copy this report:',t))}vehicleScreen();
</script></body></html>
